# Template for settings.yml file
# Should be overridden with actual values

# URL for the Flexgate server
flexgate_browse_url: "https://flexgate.org/fg2lite/sw/browse.php"

# Downloaded files will be placed here
base_download_folder: "downloads"

# List of file extensions that are considered downloadable
# Only files in the specified source folders that match these extensions will be downloaded
# Specific source files listed in the sources::files section will always be downloaded regardless of their extension
downloadable_extensions:
  - ".f2p"
  - ".f2b"
  - ".txt"
  - ".dat"
  - ".par"

# List of sources to scrape
# Each source must have a unique serial number used to identify it in the flexgate system
# Downloaded files will be placed in the folder ./{base_download_folder}/{serial}_{logger_name}/
sources:
  - serial: "D1022C"
    logger_name: "GIOS2023-02"
    folders: 
      - raw
      - par
    files: 
      - "con_log.txt"
      - "log.txt"
      - "loggerinfo.dat"
      - "service.dat"
      - "state.dat"

  - serial: "D1022F"
    logger_name: "SIS2019-01"
    folders:
      - raw
      - par
    files: 
      - "con_log.txt"
      - "log.txt"
      - "loggerinfo.dat"
      - "service.dat"
      - "state.dat"

# Optional: decode downloaded GeoPrecision data files (raw/*.f2b) to CSV after each run.
# Needs GeoPrecision's decoder program in the image (not included, see README.md,
# "Decoding GeoPrecision data files"). Without this block (or with enabled: false) the
# scraper only downloads. CSV files go to {logger folder}/{output_folder}/{raw file stem}.csv
# decoding:
#   enabled: true
#   decoder_path: /opt/geoprecision/decode3   # decoder program inside the container
#   output_folder: decoded                    # subfolder of each logger folder
#   timeout_seconds: 60                       # per decoder call
#   postprocessing:                           # optional; absent = decoder output unchanged
#     enabled: true
#     comment_char: "%"                       # exactly one non-whitespace character
#     steps:
#       - comment_metadata                    # comment out "<...>" lines and repeated headers
