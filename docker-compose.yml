services:
  flexgate_scraper:
    container_name: flexgate_scraper
    build:
      context: .
    volumes:
      - ./config/cron_jobs:/app/cron_jobs
      - ./config/settings.yml:/app/settings.yml  # must be readable by uid 30000 (dockeruser)
      - flexgate_data:/app/downloads  # Use Docker volume for downloaded files (owned by dockeruser)
    environment:
      - TZ=UTC
    restart: unless-stopped
    # Unhealthy when the last run (hourly at :20, see config/cron_jobs) is older than 130
    # minutes or had a failed source or a decode failure; see README, "Healthcheck".
    # No start_period: the script itself is healthy for 130 minutes after the start.
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "--max-age-minutes", "130"]
      interval: 5m
      timeout: 30s
      retries: 1

volumes:
  flexgate_data:


# docker exec -it flexgate_scraper /bin/bash
