services:
  flexgate_scraper:
    container_name: flexgate_scraper
    build:
      context: .
    volumes:
      - ./config/cron_jobs:/app/cron_jobs
      - ./config/settings.yml:/app/settings.yml  # must be readable by uid 30000 (dockeruser)
      - flexgate_data:/app/downloads  # Use Docker volume for downloaded files (owned by dockeruser)
    environment:
      - TZ=UTC
    restart: unless-stopped

volumes:
  flexgate_data:


# docker exec -it flexgate_scraper /bin/bash
# Manual run (the scraper refuses root):
# docker exec -u dockeruser flexgate_scraper python /app/flexgate_scraper.py